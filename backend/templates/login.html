
{% extends "base.html" %}

{% block title %}Login - RuneMind{% endblock %}

{% block content %}

<main class="auth-container">
    <section class="rm-panel auth-panel">

        <h1>RuneMind</h1>
        <h2>Login</h2>

        <form id="login-form">

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                class="rm-input"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                class="rm-input"
                required
            >

            <p id="message" role="status" aria-live="polite"></p>

            <button type="submit" class="rm-button">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="/register">Register here</a>
        </p>

    </section>
</main>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
